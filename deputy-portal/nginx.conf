server {
    listen 80;
    server_name _;

    # =========================================
    # Security headers
    # =========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/font-woff font/woff2 image/svg+xml;

    # =========================================
    # API Proxy → Backend
    # =========================================
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts للطلبات الطويلة (مثل رفع الملفات)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # السماح بحجم رفع 10MB (يطابق سقف backend)
        client_max_body_size 11M;
    }

    # =========================================
    # Static assets (immutable, long cache)
    # =========================================
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # =========================================
    # SPA fallback
    # =========================================
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # try_files: ابحث عن الملف، ثم المجلد، ثم رجوع لـ index.html (SPA)
        try_files $uri $uri/ /index.html;

        # لا cache على index.html
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # =========================================
    # Health check endpoint
    # =========================================
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # =========================================
    # Block hidden files
    # =========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
