name: CI

# يعمل على كل دفعة إلى main وعلى كل PR.
# النشر تلقائي عبر webhook إلى Coolify، فهذا هو الحاجز الوحيد
# بين دفعة كاسرة والإنتاج.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: الباك‑إند (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: التحقق من التنسيق
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::ملفات غير منسّقة بـ gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: الاختبارات مع كاشف السباقات
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: تقرير التغطية
        run: go tool cover -func=coverage.out | tail -1

      - name: البناء
        run: go build -trimpath -o /dev/null .

  frontend:
    name: الواجهة (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deputy-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: deputy-portal/package-lock.json

      - name: تثبيت التبعيات
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npx eslint .

      - name: البناء
        run: npm run build

  docker:
    name: بناء الحاوية
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # نبني نفس الـ Dockerfile الذي ينشره Coolify، فأي فشل بناء
      # يُكتشف هنا لا بعد الدفع
      - name: بناء صورة الإنتاج
        run: docker build -t parliament-portal:ci .
