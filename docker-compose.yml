# =====================================================
# Parliament Research Portal - Coolify-ready Compose
# =====================================================
# 🔒 عزل البيانات: named volumes تبقى بين الـ deployments
# 🌐 شبكة coolify: external — حيث يعمل Traefik proxy
# =====================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be at least 32 chars}
      GO_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      DB_PATH: /app/data/noab.db
      NO_SEED: ${NO_SEED:-false}
      PORT: "8080"
    volumes:
      - noab-db-data:/app/data
      - noab-uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - coolify

  frontend:
    build:
      context: ./deputy-portal
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - coolify
    labels:
      - "traefik.docker.network=coolify"
    depends_on:
      - backend

networks:
  coolify:
    external: true

volumes:
  noab-db-data:
  noab-uploads:
